apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitris-backend-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: gitris-backend
  template:
    metadata:
      labels:
        app: gitris-backend
    spec:
      serviceAccountName: gitris-backend-sa  # IRSAでAWS認証を行う
      containers:
      - name: gitris-backend-container
        # ECRのURIに置換
        image: ${AWS_ACCOUNT_ID}.dkr.ecr.ap-northeast-1.amazonaws.com/gitris-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: AWS_DEFAULT_REGION
          value: "ap-northeast-1"
        # Kubernetes Secret から注入
        - name: GITHUB_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: gitris-backend-secrets
              key: github_client_id
        - name: GITHUB_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: gitris-backend-secrets
              key: github_client_secret
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: gitris-backend-secrets
              key: jwt_secret
        - name: CORS_ALLOWED_ORIGINS
          valueFrom:
            secretKeyRef:
              name: gitris-backend-secrets
              key: cors_allowed_origins
              optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: gitris-backend-service
spec:
  type: LoadBalancer
  selector:
    app: gitris-backend
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
